name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full smoke at 07:17 UTC (off the hour so it doesn't queue behind everyone's cron).
    - cron: '17 7 * * *'

# One run per branch/PR at a time: a newer push cancels the older run. The fast
# test-and-build gate re-runs in a few minutes, and the slow smoke job would otherwise
# pile up (it takes ~60 min on a GPU-less runner).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The REQUIRED, fast gate (~3 min): full unit suite with coverage thresholds, then the
  # production build. Branch protection and releases key off this job only.
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The full unit suite, with coverage thresholds for the logic modules (vite.config.js).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - run: npm run build

  # The signal worker's own suite (infra/signal-worker, workerd via @cloudflare/vitest-plugin; needs
  # Node 22+). Runs only when the worker, its wrapper script or its workflow changed (NETWORKING.md §15).
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did the worker change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD -- infra/signal-worker scripts/worker.mjs .github/workflows/worker.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No signal worker changes: skipping its tests."
          fi
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/signal-worker/package-lock.json
      - if: steps.changed.outputs.run == 'true'
        run: npm run worker:test

  # Browser smoke (Playwright + system Chrome on SwiftShader). It is slow and informational,
  # not a merge gate: developers run the full smoke locally before merging.
  #   - pushes to main, manual runs and the nightly schedule: the FULL scenario list
  #   - pull requests: a short subset (menus, controller flow, results/unlocks, mode menu,
  #     one track) so a PR gets a browser signal in minutes instead of an hour
  smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 80 # ~60 min with all showcase scenarios (4x CI timeouts)
    env:
      # CI profile (scripts/smoke-plan.mjs): 800x450 @ dpr 1, 4x timeouts, trimmed 4p set, 1 retry.
      CI: 'true'
      # Empty = every scenario. PRs get the short subset (names are smoke.mjs filters).
      SMOKE_FILTERS: ${{ github.event_name == 'pull_request' && 'menu-flow gamepad-flow results-unlock modes-menu cotton-candy-castle-1p' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chrome version
        run: google-chrome --version || echo "no system Chrome - Playwright will complain below"
      - name: Smoke (${{ github.event_name == 'pull_request' && 'PR subset' || 'full' }})
        # SMOKE_FILTERS is word-split on purpose: each word is one smoke.mjs filter.
        run: node scripts/smoke.mjs $SMOKE_FILTERS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-out/
          retention-days: 7
          if-no-files-found: ignore
