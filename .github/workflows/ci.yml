name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR/branch cancels the older run (main always finishes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The full unit suite, with coverage thresholds for the logic modules (vite.config.js).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 45
    env:
      # CI profile (scripts/smoke-plan.mjs): 800x450 @ dpr 1, 4x timeouts, trimmed 4p set, 1 retry.
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chrome version
        run: google-chrome --version || echo "no system Chrome - Playwright will complain below"
      - run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-out/
          retention-days: 7
          if-no-files-found: ignore
