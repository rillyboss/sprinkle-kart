<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>UI preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #333; }
    #game {
      position: fixed; inset: 0;
      background:
        linear-gradient(180deg, #ffc6e6 0%, #ffe3f3 38%, #f7a8d5 38.5%, #e98cc2 100%);
    }
    .fakeview { position: absolute; overflow: hidden; }
    .fakeview::before { content: ''; position: absolute; left: 30%; right: 30%; bottom: 0; height: 55%;
      background: linear-gradient(180deg, #ffd9ee, #ffb3dc); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); }
    .fakeview::after { content: '🏎️'; position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); font-size: 4em; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
