<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sprinkle Kart</title>
    <meta name="description" content="Sprinkle Kart - a cute, family-friendly 3D split-screen kart racer made for Sophia." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍭</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffd6ec;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        overflow: hidden;
      }

      /* ---------- cute loading screen ---------- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2vh;
        font-family: 'Fredoka', 'Baloo 2', 'Nunito', 'Comic Sans MS', system-ui, sans-serif;
        color: #6b3a7a;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.8) 0 6%, transparent 22%),
          radial-gradient(circle at 85% 80%, rgba(143, 240, 207, 0.55) 0 6%, transparent 30%),
          linear-gradient(160deg, #ffd6ec 0%, #f3d4ff 45%, #d5e9ff 100%);
        transition: opacity 0.5s ease;
        user-select: none;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .logo {
        font-size: clamp(38px, 9vw, 120px);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff;
        text-shadow:
          0 0.05em 0 #ff5fb4, 0 0.1em 0 #e0449a, 0 0.16em 0 #c9a7ff,
          0 0.3em 0.4em rgba(140, 60, 160, 0.35);
        animation: sk-bob 1.6s ease-in-out infinite;
      }
      #loading .kart {
        font-size: clamp(40px, 8vw, 96px);
        animation: sk-drive 1.1s ease-in-out infinite;
      }
      #loading .bar {
        width: min(60vw, 520px);
        height: 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: inset 0 3px 0 rgba(160, 70, 150, 0.15), 0 6px 0 rgba(160, 70, 150, 0.15);
        overflow: hidden;
      }
      #loading .fill {
        height: 100%;
        width: 4%;
        border-radius: 999px;
        background: repeating-linear-gradient(-45deg, #ff8fc8 0 14px, #ffb3da 14px 28px);
        background-size: 40px 40px;
        animation: sk-stripes 0.8s linear infinite;
        transition: width 0.3s ease;
      }
      #loading .msg { font-size: clamp(16px, 2.6vw, 30px); font-weight: 600; }
      #loading .err { display: none; max-width: 80vw; text-align: center; font-size: 20px; }
      #loading.failed .err { display: block; }
      @keyframes sk-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      @keyframes sk-drive { 0%, 100% { transform: translateX(-30px) rotate(-4deg); } 50% { transform: translateX(30px) rotate(4deg); } }
      @keyframes sk-stripes { to { background-position: 40px 0; } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="logo">Sprinkle Kart</div>
      <div class="kart">🏎️💨</div>
      <div class="bar"><div class="fill" id="loading-fill"></div></div>
      <div class="msg" id="loading-msg">Sprinkling the sprinkles...</div>
      <div class="err" id="loading-err">Oh no, something got sticky! Try refreshing the page. 🍬</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
